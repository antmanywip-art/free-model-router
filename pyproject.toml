[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-model-router"
version = "0.1.0"
description = "Personal, fail-closed free AI API router"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.13.5"]

[project.scripts]
free-model-router = "free_router.__main__:main"

[tool.setuptools.packages.find]
include = ["free_router*"]
